<form class="rz-search-pill" (submit)="search($event)">
  
  <div class="input-group">
    <mat-icon class="search-icon">search</mat-icon>
    <input type="search" 
           [formControl]="searchControl" 
           [matAutocomplete]="auto" 
           placeholder="Search city, locality..." 
           aria-label="Search">
           
    <mat-autocomplete #auto="matAutocomplete" 
                      [displayWith]="displayCity" 
                      (optionSelected)="onCitySelected($event)"
                      class="custom-autocomplete-panel">
      <mat-option *ngFor="let city of filteredCities" [value]="city">
         {{ city.name }}, {{ city.stateCode }}
      </mat-option>
    </mat-autocomplete>
  </div>

  <div class="divider hide-mobile"></div>

  <div class="filter-group">
    <mat-select class="custom-mat-select" placeholder="Property Type" panelClass="custom-select-panel">
      <mat-option value="pg">PG / Room</mat-option>
      <mat-option value="1bhk">1 BHK</mat-option>
      <mat-option value="2bhk">2 BHK</mat-option>
      <mat-option value="3bhk">3+ BHK</mat-option>
    </mat-select>
  </div>

  <div class="divider hide-mobile"></div>

  <div class="filter-group">
    <mat-select class="custom-mat-select" placeholder="Budget" panelClass="custom-select-panel">
      <mat-option value="0-5000">Up to ₹5k</mat-option>
      <mat-option value="5000-10000">₹5k - ₹10k</mat-option>
      <mat-option value="10000-20000">₹10k - ₹20k</mat-option>
      <mat-option value="20000+">₹20k+</mat-option>
    </mat-select>
  </div>

  <button type="submit" class="btn-primary search-btn">Search</button>
</form>
